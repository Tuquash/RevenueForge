
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password | RevenueForge</title>
  <link rel="stylesheet" href="login.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
</head>
<body>
  <main class="login-layout">
    <section class="login-brand">
      <a class="brand" href="login.html">Revenue<span>Forge</span></a>
      <p class="tagline">ACCOUNT RECOVERY</p>
      <h1>Get back to<br><span>business.</span></h1>
      <p class="description">Enter your registered email address. We'll send you a secure password reset link.</p>
    </section>

    <section class="login-card">
      <p class="eyebrow">PASSWORD RECOVERY</p>
      <h2>Forgot your password?</h2>

      <form id="recovery-form">
        <label for="email">Email address</label>
        <input id="email" type="email" required placeholder="you@example.com">

        <button type="submit" id="send-button">Send reset link</button>
        <p id="message" role="status"></p>
      </form>

      <p class="security-note">
        <a href="login.html">Back to sign in</a>
      </p>
    </section>
  </main>

  <script>
    const client = window.supabase.createClient(
      window.REVENUEFORGE_SUPABASE_URL,
      window.REVENUEFORGE_SUPABASE_KEY
    );

    document.getElementById("recovery-form").addEventListener("submit", async (event) => {
      event.preventDefault();

      const button = document.getElementById("send-button");
      const message = document.getElementById("message");

      button.disabled = true;
      message.textContent = "Sending reset link...";

      try {
        const email = document.getElementById("email").value.trim();
        const redirectTo = new URL("reset-password.html", window.location.href).href;

        const { error } = await client.auth.resetPasswordForEmail(email, {
          redirectTo: redirectTo
        });

        if (error) throw error;

        message.textContent = "Check your email for the password reset link.";
      } catch (error) {
        message.textContent = error.message;
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
