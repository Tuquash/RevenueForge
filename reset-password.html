
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password | RevenueForge</title>
  <link rel="stylesheet" href="login.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
</head>
<body>
  <main class="login-layout">
    <section class="login-brand">
      <a class="brand" href="login.html">Revenue<span>Forge</span></a>
      <p class="tagline">ACCOUNT RECOVERY</p>
      <h1>Secure your<br><span>account.</span></h1>
      <p class="description">Choose a new password to regain access to your RevenueForge account.</p>
    </section>

    <section class="login-card">
      <p class="eyebrow">NEW PASSWORD</p>
      <h2>Reset your password</h2>

      <form id="reset-form">
        <label for="password">New password</label>
        <input
          id="password"
          type="password"
          required
          minlength="8"
          placeholder="At least 8 characters"
        >

        <label for="confirm-password">Confirm new password</label>
        <input
          id="confirm-password"
          type="password"
          required
          minlength="8"
          placeholder="Enter password again"
        >

        <button type="submit" id="reset-button" disabled>
          Checking reset link...
        </button>

        <p id="message" role="status"></p>
      </form>

      <p class="security-note">
        <a href="login.html">Back to sign in</a>
      </p>
    </section>
  </main>

  <script>
    const client = window.supabase.createClient(
      window.REVENUEFORGE_SUPABASE_URL,
      window.REVENUEFORGE_SUPABASE_KEY
    );

    const form = document.getElementById("reset-form");
    const button = document.getElementById("reset-button");
    const message = document.getElementById("message");

    let recoverySessionAvailable = false;

    async function checkResetSession() {
      try {
        const { data, error } = await client.auth.getSession();

        if (error) throw error;

        if (data.session) {
          recoverySessionAvailable = true;
          button.disabled = false;
          button.textContent = "Update password";
          message.textContent = "Reset link verified. Enter your new password.";
        } else {
          button.disabled = true;
          button.textContent = "Reset link unavailable";
          message.textContent =
            "Reset link invalid or expired. Request another reset link.";
        }
      } catch (error) {
        button.disabled = true;
        button.textContent = "Reset link unavailable";
        message.textContent = error.message;
      }
    }

    client.auth.onAuthStateChange((event, session) => {
      if (event === "PASSWORD_RECOVERY" && session) {
        recoverySessionAvailable = true;
        button.disabled = false;
        button.textContent = "Update password";
        message.textContent = "Reset link verified. Enter your new password.";
      }
    });

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      if (!recoverySessionAvailable) {
        message.textContent = "Your reset link is invalid or expired. Request another.";
        return;
      }

      const password = document.getElementById("password").value;
      const confirmPassword = document.getElementById("confirm-password").value;

      if (password.length < 8) {
        message.textContent = "Your password must be at least 8 characters.";
        return;
      }

      if (password !== confirmPassword) {
        message.textContent = "The passwords do not match.";
        return;
      }

      button.disabled = true;
      button.textContent = "Updating...";
      message.textContent = "";

      try {
        const { error } = await client.auth.updateUser({
          password: password
        });

        if (error) throw error;

        message.textContent =
          "Password updated successfully. You can now return to sign in.";

        form.reset();
        recoverySessionAvailable = false;
        button.textContent = "Password updated";
      } catch (error) {
        message.textContent = error.message;
        button.disabled = false;
        button.textContent = "Update password";
      }
    });

    checkResetSession();
  </script>
</body>
</html>
